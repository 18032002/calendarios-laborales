trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'MiConexionAzure'   
  webAppName: 'calendarios-app'           
  javaVersion: '17'

stages:
- stage: Build
  displayName: 'Etapa 1: Build (CI)'
  jobs:
  - job: BuildJob
    steps:
    - task: UseJavaVersion@1
      inputs:
        versionSpec: '$(javaVersion)'
        distribution: 'temurin'

    - task: Maven@3
      inputs:
        mavenPomFile: 'pom.xml'
        mavenWrapper: true
        goals: 'clean install'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'

    - task: CopyFiles@2
      inputs:
        contents: '**/target/*.jar'
        targetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

- stage: Deploy
  displayName: 'Etapa 2: Deploy (CD)'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: AzureWebApp@1
      inputs:
        azureSubscription: '$(azureSubscription)'
        appType: 'webAppLinux'
        appName: '$(webAppName)'
        package: '$(System.ArtifactsDirectory)/drop/**/*.jar'
        runtimeStack: 'JAVA|17-java17'